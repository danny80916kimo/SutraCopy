<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抄經 SutraCopy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@300;600;900&family=Zen+Old+Mincho:wght@400&display=swap" rel="stylesheet">
<style>
:root{--stage-bg:#14110e;--slide-bg:#f3ecdc;--paper:#f3ecdc;--paper-deep:#e6dcc4;--ink:#1c1a17;--ink-faint:rgba(28,26,23,.14);--grid:rgba(120,90,50,.28);--zhu:#b3382a;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg)}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg)}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg)}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important}}

.slide{font-family:'Noto Serif TC',serif;color:var(--ink);
 background:
  radial-gradient(ellipse at 15% 20%, rgba(255,255,255,.45), transparent 55%),
  radial-gradient(ellipse at 85% 90%, rgba(150,120,70,.16), transparent 55%),
  var(--paper)}
/* 宣紙纖維 */
.slide::before{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;pointer-events:none;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .45 0 0 0 0 .3 0 0 0 .5 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
/* 右側抄經格：一直行 */
.column{position:absolute;right:190px;top:100px;display:flex;flex-direction:column;border:1.5px solid var(--grid)}
.cell{width:110px;height:110px;border-bottom:1px solid var(--grid);position:relative;display:grid;place-items:center}
.cell:last-child{border-bottom:none}
.cell::before{content:"";position:absolute;inset:0;background:linear-gradient(var(--grid) 0 0) center/100% 1px no-repeat,linear-gradient(var(--grid) 0 0) center/1px 100% no-repeat;opacity:.35}
.cell .ghost{position:absolute;font-family:'LXGW WenKai TC',serif;font-size:82px;color:var(--ink-faint);line-height:1}
.cell .ink{position:relative;font-family:'LXGW WenKai TC',serif;font-weight:700;font-size:84px;line-height:1;color:var(--ink);opacity:0;transform:scale(.7) rotate(-6deg);filter:blur(4px);transition:opacity .5s var(--ease),transform .7s var(--ease),filter .6s var(--ease)}
.slide.visible .cell .ink{opacity:1;transform:none;filter:none}
.cell:nth-child(1) .ink{transition-delay:.6s}.cell:nth-child(2) .ink{transition-delay:1.0s}.cell:nth-child(3) .ink{transition-delay:1.4s}.cell:nth-child(4) .ink{transition-delay:1.8s}.cell:nth-child(5) .ink{transition-delay:2.2s}.cell:nth-child(6) .ink{transition-delay:2.6s}.cell:nth-child(7) .ink{transition-delay:3.0s}.cell:nth-child(8) .ink{transition-delay:3.4s}
/* 經名直行 */
.jingming{position:absolute;right:340px;top:100px;height:880px;writing-mode:vertical-rl;font-weight:300;font-size:40px;letter-spacing:.42em;color:var(--ink);opacity:.75;border-right:1px solid var(--grid);padding-right:40px}
/* 左側標題 */
.title{position:absolute;left:150px;top:180px;font-weight:900;font-size:300px;line-height:1;letter-spacing:.04em;color:var(--ink)}
.latin{position:absolute;left:158px;top:520px;font-family:'Zen Old Mincho',serif;font-size:46px;letter-spacing:.22em;color:var(--ink);opacity:.6}
.sub{position:absolute;left:158px;top:640px;width:760px;font-size:34px;line-height:1.85;font-weight:300}
.sub b{font-weight:600;color:var(--zhu)}
.meta{position:absolute;left:158px;bottom:100px;font-size:22px;letter-spacing:.3em;color:var(--ink);opacity:.55}
/* 硃砂印 */
.seal{position:absolute;left:880px;top:560px;width:150px;height:150px;border:5px solid var(--zhu);border-radius:10px;color:var(--zhu);display:grid;place-items:center;font-family:'LXGW WenKai TC',serif;font-weight:700;font-size:58px;line-height:1.05;writing-mode:vertical-rl;letter-spacing:.05em;transform:rotate(-4deg);
 box-shadow:inset 0 0 0 2px rgba(179,56,42,.35);opacity:.88}
.seal-wrap{position:absolute;left:880px;top:560px;opacity:0;transform:scale(1.25);transition:opacity .35s ease 3.9s,transform .45s cubic-bezier(.2,1.6,.4,1) 3.9s}
.slide.visible .seal-wrap{opacity:.92;transform:none}
.seal-wrap .seal{position:static;transform:rotate(-4deg)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity 1.2s var(--ease),transform 1.2s var(--ease)}
.slide.visible .reveal{opacity:1;transform:none}
.d1{transition-delay:.1s}.d2{transition-delay:.3s}.d3{transition-delay:.5s}.d4{transition-delay:.7s}.d5{transition-delay:.2s}
</style>
</head>
<body>
<div class="deck-viewport"><main class="deck-stage" id="deckStage">
<section class="slide active">
  <h1 class="title reveal d1">抄經</h1>
  <p class="latin reveal d2">SutraCopy</p>
  <p class="sub reveal d3">用手指，<b>一字一格</b>，抄寫般若心經二百六十字。<br>寫完，排成直書經文，成為一幅可以分享的作品。</p>
  <p class="meta reveal d4">產品介紹 · 二〇二六年九月</p>
  <div class="seal-wrap"><div class="seal">抄經</div></div>
  <div class="jingming reveal d5">般若波羅蜜多心經</div>
  <div class="column reveal d5">
    <div class="cell"><span class="ghost">觀</span><span class="ink">觀</span></div>
    <div class="cell"><span class="ghost">自</span><span class="ink">自</span></div>
    <div class="cell"><span class="ghost">在</span><span class="ink">在</span></div>
    <div class="cell"><span class="ghost">菩</span><span class="ink">菩</span></div>
    <div class="cell"><span class="ghost">薩</span><span class="ink">薩</span></div>
    <div class="cell"><span class="ghost">行</span><span class="ink">行</span></div>
    <div class="cell"><span class="ghost">深</span><span class="ink">深</span></div>
    <div class="cell"><span class="ghost">般</span><span class="ink">般</span></div>
  </div>
</section>
</main></div>
<script>
const s=document.getElementById('deckStage');function fit(){const f=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`}fit();addEventListener('resize',fit);
requestAnimationFrame(()=>setTimeout(()=>document.querySelector('.slide').classList.add('visible'),80));
</script>
</body></html>
