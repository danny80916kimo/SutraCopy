<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抄經 SutraCopy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;900&display=swap" rel="stylesheet">
<style>
:root{--stage-bg:#000;--slide-bg:#111111;--ink:#111111;--fire:#E85D26;--cream:#F0ECE5;--cream-muted:#888880;--cream-hint:#505048;--border:#282826;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg)}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg)}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg)}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important}}

.slide{font-family:'Barlow',sans-serif;color:var(--cream)}
.chrome{position:absolute;left:80px;right:80px;top:64px;display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:20px;letter-spacing:.08em;color:var(--cream-muted);text-transform:uppercase;padding-bottom:22px;border-bottom:1px solid var(--border)}
.chrome b{color:var(--fire);font-weight:500}
.display{position:absolute;left:72px;top:170px;font-weight:900;font-size:330px;line-height:.86;letter-spacing:-.04em;color:var(--cream);text-transform:lowercase}
.display em{font-style:normal;color:var(--fire)}
.cn{position:absolute;left:820px;top:470px;font-family:'Noto Sans TC',sans-serif;font-weight:900;font-size:120px;line-height:1;letter-spacing:0;color:var(--fire)}
.deck{position:absolute;right:80px;top:700px;width:640px;font-size:34px;line-height:1.45;font-weight:400;color:var(--cream);padding-top:26px;border-top:1px solid var(--border)}
.deck span{display:block;margin-top:18px;font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--cream-muted);letter-spacing:.06em}
.foot{position:absolute;left:80px;right:80px;bottom:64px;display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--cream-hint);padding-top:22px;border-top:1px solid var(--border)}
.bar{position:absolute;right:0;top:0;width:28px;height:1080px;background:var(--fire)}
.reveal{opacity:0;transform:translateY(40px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.slide.visible .reveal{opacity:1;transform:none}
.d1{transition-delay:.05s}.d2{transition-delay:.2s}.d3{transition-delay:.4s}.d4{transition-delay:.55s}.d5{transition-delay:.7s}
</style>
</head>
<body>
<div class="deck-viewport"><main class="deck-stage" id="deckStage">
<section class="slide active">
  <div class="bar"></div>
  <div class="chrome reveal d1"><span><b>sutracopy</b> — ios app</span><span>ryan liou · 2026.09</span></div>
  <h1 class="display reveal d2">sutra<br><em>copy</em></h1>
  <div class="cn reveal d3">抄經</div>
  <p class="deck reveal d4">一字一格，用手指抄寫般若心經。寫完，排成直書經文，一鍵分享。<span>260 characters · 2 pages · 1080 × 1920</span></p>
  <div class="foot reveal d5"><span>product pitch</span><span>01 / 08</span></div>
</section>
</main></div>
<script>
const s=document.getElementById('deckStage');function fit(){const f=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`}fit();addEventListener('resize',fit);
requestAnimationFrame(()=>setTimeout(()=>document.querySelector('.slide').classList.add('visible'),80));
</script>
</body></html>
