<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抄經 SutraCopy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@300;500;700&family=Source+Serif+4:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--stage-bg:#1a1a1a;--slide-bg:#faf9f7;--ink:#1a1a1a;--ink-soft:#6b6762;--crimson:#c41e3a;--rule:#d9d4cb;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--stage-bg)}
.deck-viewport{position:fixed;inset:0;overflow:hidden;background:var(--stage-bg)}
.deck-stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--slide-bg)}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;display:block;visibility:hidden;opacity:0;pointer-events:none;background:var(--slide-bg)}
.slide.active,.slide.visible{visibility:visible;opacity:1;pointer-events:auto;z-index:1}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.2s!important}}

.slide{font-family:'Source Serif 4',serif;color:var(--ink)}
.frame{position:absolute;inset:64px;border:1px solid var(--rule)}
.rule-top{position:absolute;left:140px;right:140px;top:150px;height:1px;background:var(--ink)}
.rule-bot{position:absolute;left:140px;right:140px;bottom:150px;height:1px;background:var(--rule)}
.masthead{position:absolute;top:100px;left:140px;right:140px;display:flex;justify-content:space-between;font-family:'Cormorant Garamond',serif;font-size:24px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft)}
.title{position:absolute;left:140px;top:260px;font-family:'Noto Serif TC',serif;font-weight:700;font-size:220px;line-height:1;letter-spacing:.06em;color:var(--ink)}
.title .drop{color:var(--crimson)}
.latin{position:absolute;left:150px;top:520px;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:72px;color:var(--ink-soft)}
.sub{position:absolute;left:150px;top:640px;width:900px;font-size:34px;line-height:1.7;font-weight:300;color:var(--ink)}
.meta{position:absolute;left:150px;bottom:180px;font-family:'Cormorant Garamond',serif;font-size:26px;letter-spacing:.2em;color:var(--ink-soft)}
.quote{position:absolute;right:160px;top:230px;height:620px;writing-mode:vertical-rl;font-family:'Noto Serif TC',serif;font-weight:300;font-size:44px;line-height:2.1;letter-spacing:.32em;color:var(--ink);border-right:2px solid var(--crimson);padding-right:36px}
.quote small{font-size:22px;letter-spacing:.3em;color:var(--ink-soft);margin-top:40px}
.reveal{opacity:0;transform:translateY(28px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.slide.visible .reveal{opacity:1;transform:none}
.reveal:nth-of-type(1){transition-delay:.1s}.reveal:nth-of-type(2){transition-delay:.25s}.reveal:nth-of-type(3){transition-delay:.4s}.reveal:nth-of-type(4){transition-delay:.55s}.reveal:nth-of-type(5){transition-delay:.7s}.reveal:nth-of-type(6){transition-delay:.85s}
</style>
</head>
<body>
<div class="deck-viewport"><main class="deck-stage" id="deckStage">
<section class="slide active">
  <div class="frame"></div>
  <div class="masthead reveal"><span>SutraCopy · iOS</span><span>2026 · 09</span></div>
  <div class="rule-top"></div>
  <h1 class="title reveal"><span class="drop">抄</span>經</h1>
  <p class="latin reveal">SutraCopy</p>
  <p class="sub reveal">用手指，一字一格，抄寫般若心經二百六十字。<br>寫完，成為一幅可以分享的直書經文。</p>
  <p class="meta reveal">產品介紹 · RYAN LIOU</p>
  <div class="quote reveal">觀自在菩薩　行深般若波羅蜜多時<small>般若波羅蜜多心經</small></div>
  <div class="rule-bot"></div>
</section>
</main></div>
<script>
const s=document.getElementById('deckStage');function fit(){const f=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`translate(${(innerWidth-1920*f)/2}px,${(innerHeight-1080*f)/2}px) scale(${f})`}fit();addEventListener('resize',fit);
requestAnimationFrame(()=>setTimeout(()=>document.querySelector('.slide').classList.add('visible'),80));
</script>
</body></html>
