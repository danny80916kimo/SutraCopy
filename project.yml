name: SutraCopy
options:
  bundleIdPrefix: com.ryanliou
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  SutraCopy:
    type: application
    platform: iOS
    sources:
      - path: SutraCopy
    info:
      path: SutraCopy/Info.plist
      properties:
        CFBundleDisplayName: 抄經
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSPhotoLibraryAddUsageDescription: 將抄寫完成的經文圖片儲存到相簿。
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
